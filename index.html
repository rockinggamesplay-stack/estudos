textarea{min-height:96px;resize:vertical}
label.cmp{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
.erro{color:var(--er);font-size:13px;margin-top:4px}

.etapas a{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}

.nav-et{display:flex;justify-content:space-between;gap:8px;margin-top:24px;flex-wrap:wrap}
.op{display:block;border:1px solid var(--lin);border-radius:10px;padding:10px 12px;margin:6px 0;background:#fff;cursor:pointer;font-size:15px}
.op input{margin-right:8px}.op.certa{border-color:var(--ok);background:var(--ok2)}.op.errada{border-color:var(--er);background:var(--er2)}
.lk{display:block;padding:12px 14px;border:1px solid var(--lin);border-radius:10px;margin:8px 0;background:#fff;text-decoration:none;color:inherit}
.lk b{color:var(--ac)}.lk span{display:block;font-size:13px;color:var(--mut)}
.nota{white-space:pre-wrap}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--lin);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bot a{flex:1;max-width:190px;text-align:center;padding:9px 4px 10px;font-size:12px;color:var(--mut);text-decoration:none;font-weight:600}
nav.bot a .i{display:block;font-size:20px;line-height:1.2}
nav.bot a.at{color:var(--ac)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--es);color:#fff;font-size:11px;margin-left:3px}
.vazio{text-align:center;padding:24px 8px;color:var(--mut)}
details summary{cursor:pointer;font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px;margin:14px 0;padding:12px;background:#fff;border:1px solid var(--lin);border-radius:var(--r)}
.bolha{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5}
.bolha.eu{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.bolha.ia{align-self:flex-start;background:#efeee9;color:var(--tx);border-bottom-left-radius:4px}
</style>
</head>

  {t:'html', h:`<p>Antes de qualquer teoria, três histórias. Leia com calma e pense: <b>o que deu errado?</b></p>
  <div class="card"><span class="tag">Caso real · EUA, 2023</span><h3>O advogado e os processos que não existiam</h3>
  <p>Um advogado com cerca de 30 anos de carreira usou o ChatGPT para achar decisões parecidas com o caso de um cliente que processava a companhia aérea Avianca.</p>
  <p>A IA entregou uma lista de decisões judiciais com nomes, datas e trechos. Pelo menos <b>seis delas nunca existiram</b>. Desconfiado, ele perguntou ao próprio ChatGPT se os casos eram reais, e a IA disse que sim.</p>

  <div class="box"><p><b>1. Nos três casos, a IA entregou algo com cara de certo.</b> Texto bem escrito passa confiança, mas a IA não "sabe" se o que escreveu é verdade. Ela monta o texto mais provável, e você vai ver como isso funciona na etapa 2.</p></div>
  <div class="box"><p><b>2. O advogado e o juiz erraram na conferência.</b> Os dois publicaram sem checar numa fonte oficial (a base de processos dos tribunais). O advogado ainda usou a própria IA para conferir a IA.</p></div>
  <div class="box"><p><b>3. O estoquista errou no pedido e na conferência.</b> O pedido não tinha contexto (qual sistema, quais produtos, qual o problema real), e ninguém revisou antes de imprimir.</p></div>
  <div class="box es"><p><b>4. A lição de gestão:</b> o juiz culpou o assessor, mas quem assinou a sentença foi ele. Em todos os casos, a responsabilidade continuou sendo de quem usou o resultado, e não da IA nem de quem ajudou. Guarde esta frase, porque ela vai voltar muitas vezes no curso: <b>"Você pode delegar a tarefa, nunca a responsabilidade."</b></p></div>
  <p>Esta unidade ensina a evitar exatamente esses erros: <b>pedir mal</b>, <b>aceitar a primeira resposta</b> e <b>não conferir</b>.</p>`}
 ]},
 {n:2, titulo:'Exemplo resolvido', tipo:'Eu mostro passo a passo, em 5 partes curtas', essencial:true, blocos:[
  {t:'html', h:`<p class="mut">Esta etapa tem 5 partes curtas. Depois de cada uma há uma pergunta rápida: responda antes de seguir. Pode fazer em mais de uma sessão.</p>
  <h2>Parte 1 de 5 · Como a IA escreve</h2>
  <p>Sabe o corretor do celular, que sugere a próxima palavra? A IA é isso, mas <b>muito</b> mais treinada: ela leu uma quantidade gigantesca de textos e aprendeu quais palavras costumam vir depois de quais.</p>
  <p>Quando você pede algo, ela escreve <b>uma palavra de cada vez</b>, sempre escolhendo entre as mais prováveis:</p>
  <div class="fig">${SVG_PROX}<div class="leg">Números ilustrativos, só para mostrar a ideia.</div></div>
  <div class="card"><b>Comparação com o armazém:</b> imagine um colega veterano a quem você pergunta "onde fica o item X?". Ele responde de cabeça e quase sempre acerta, porque conhece o padrão do armazém. Mas se o item é novo, ele <b>chuta um endereço com a mesma confiança</b>. Ele não está mentindo: está completando o padrão. A IA faz a mesma coisa.</div>
  <p><b>Isso tem 3 consequências práticas:</b></p>
  <ol><li><b>Sem contexto, ela completa com o genérico.</b> Foi por isso que o POP falava em WMS e em temperatura: é o "armazém médio" da internet, e não o seu.</li>
  <li><b>Ela inventa mais em nomes, números, fórmulas, normas e citações</b>, porque são coisas que "parecem" certas mesmo quando estão erradas.</li>
  <li><b>Ela tende a concordar com você.</b> Se você pergunta "isso está certo?", a resposta tende a ser sim. Peça crítica de propósito.</li></ol>`},
  {t:'check', id:'u1-k1', p:'Você pergunta à IA em qual endereço guardar um item que acabou de chegar, sem dar nenhuma informação sobre o seu armazém. O que é mais provável?',
   o:['Ela avisa que não tem como saber','Ela sugere um endereço que parece real, com confiança','Ela consulta o seu ERP para descobrir','Ela se recusa a responder a pergunta'], c:1,
   pq:'Sem contexto, ela completa o padrão com algo plausível, como o colega veterano chutando o endereço. Ela não acessa o seu sistema a menos que você dê a informação.'},
  {t:'html', h:`<h2>Parte 2 de 5 · Os 4D, o mapa do bom uso</h2>
  <p>A Anthropic, empresa que cria o Claude, ensina a usar IA em 4 movimentos, os <b>4D</b>:</p>
  <div class="fig">${SVG_4D}</div>
  <p>Repare: <b>são as mesmas 4 coisas que um bom gestor faz com a equipe.</b> Decide o que delegar, explica bem, avalia a entrega e responde pelo resultado. Aprender IA aqui é treinar liderança ao mesmo tempo.</p>
  <div class="card"><span class="tag">Caso real · Suécia, 2024–2025</span><h3>Klarna: quando delegar demais sai caro</h3>
  <p>A Klarna, uma empresa de pagamentos, anunciou em 2024 que o assistente de IA dela fazia o trabalho de <b>700 atendentes</b>. Em 2025, o próprio presidente da empresa admitiu que tinham ido longe demais: o custo pesou demais na decisão, a <b>qualidade do atendimento caiu</b>, e a empresa voltou a contratar pessoas. Ele também disse que o cliente deve sempre poder falar com um humano, se quiser.</p>
  <p class="mut">A IA não "falhou" sozinha. A decisão de quanto passar para ela foi da gestão.</p></div>`},
  {t:'check', id:'u1-k2', p:'No caso da Klarna, qual dos 4D falhou primeiro?',
   o:['Delegar: passaram para a IA mais do que ela fazia bem','Descrever: os pedidos para a IA estavam mal escritos','Diligência: a empresa culpou a IA pelo problema','Nenhum: o problema foi só tecnológico'], c:0,
   pq:'A decisão de quanto delegar foi tomada olhando principalmente o custo. Discernir também falhou (demoraram para perceber a queda), mas o erro começou no "Delegar".'},
  {t:'html', h:`<h2>Parte 3 de 5 · Como pedir bem (o "Descrever")</h2>
  <p>Um bom pedido tem 5 partes. Para lembrar: <b>PCTFE</b>, "<b>P</b>eça <b>C</b>om <b>T</b>odos os <b>F</b>atos <b>E</b>ssenciais".</p>
  <div class="fig">${SVG_PCTFE}</div>
  <p><b>Exemplo resolvido:</b> vamos consertar o pedido do caso de armazém, uma parte de cada vez. Veja o que cada parte muda.</p>
  <div class="pedido">faz um POP de recebimento</div>
  <div class="passo"><div class="n">P</div><div><b>+ Papel:</b> "Você é um especialista em processos de armazém que escreve procedimentos simples para equipes operacionais."<br><span class="mut">O que muda: o tom e o nível. Sai o texto de consultoria e entra o texto de chão de armazém.</span></div></div>
  <div class="passo"><div class="n">C</div><div><b>+ Contexto:</b> "Somos uma empresa que fabrica e importa equipamentos médicos veterinários. O recebimento é feito por 2 pessoas. Usamos um ERP e não temos WMS. Os itens importados têm número de série, e o erro mais comum é dar entrada sem conferir o número de série."<br><span class="mut">O que muda: some o genérico (WMS, temperatura) e aparece o problema real.</span></div></div>
  <div class="passo"><div class="n">T</div><div><b>+ Tarefa:</b> "Escreva um POP de recebimento de mercadorias importadas, do descarregamento até a entrada no ERP."<br><span class="mut">O que muda: a tarefa ganha começo e fim claros.</span></div></div>
  <div class="passo"><div class="n">F</div><div><b>+ Formato:</b> "No máximo 10 passos numerados, frases curtas, cada passo dizendo quem faz. No fim, um checklist de 5 itens para imprimir."<br><span class="mut">O que muda: chega pronto para usar, sem precisar reformatar.</span></div></div>
  <div class="passo"><div class="n">E</div><div><b>+ Exemplo e regras:</b> "Exemplo de passo: '3. Conferente: compara o número de série da etiqueta com o da nota. Se divergir, separa na área de pendências.' Se faltar alguma informação, me pergunte antes de escrever. Não invente sistemas nem normas."<br><span class="mut">O que muda: a IA copia o estilo do exemplo, pergunta em vez de chutar e fica proibida de inventar.</span></div></div>
  <p><b>Pedido final:</b></p>
  <div class="pedido"><b>Papel:</b> Você é um especialista em processos de armazém que escreve procedimentos simples para equipes operacionais.
<b>Contexto:</b> Somos uma empresa que fabrica e importa equipamentos médicos veterinários. O recebimento é feito por 2 pessoas. Usamos um ERP e não temos WMS. Os itens importados têm número de série, e o erro mais comum é dar entrada sem conferir o número de série.
<b>Tarefa:</b> Escreva um POP de recebimento de mercadorias importadas, do descarregamento até a entrada no ERP.
<b>Formato:</b> No máximo 10 passos numerados, frases curtas, cada passo dizendo quem faz. No fim, um checklist de 5 itens para imprimir.
<b>Exemplo e regras:</b> Exemplo de passo: "3. Conferente: compara o número de série da etiqueta com o da nota. Se divergir, separa na área de pendências." Se faltar alguma informação, me pergunte antes de escrever. Não invente sistemas nem normas.</div>
  <div class="box">Não precisa escrever "Papel:", "Contexto:" etc. no pedido de verdade. Os rótulos aqui são só para você enxergar as partes. Com o tempo, isso vira hábito.</div>
  <div class="card es"><span class="tag es">Faça agora · 5 min</span><p>Abra o Claude e mande <b>o pedido ruim</b> ("faz um POP de recebimento") numa conversa. Depois mande <b>o pedido final</b> numa conversa nova. Compare as duas respostas.</p></div>`},
  {t:'campo', id:'u1-e2-teste', label:'O que mudou de uma resposta para a outra? O que a resposta boa ainda errou ou inventou?', ph:'Ex.: a primeira falava de WMS; a segunda me fez perguntas antes...', l:4},
  {t:'check', id:'u1-k3', p:'Qual parte do PCTFE faz a IA perguntar em vez de chutar?',
   o:['Papel','Tarefa','Formato','Exemplo e regras ("se faltar informação, me pergunte")'], c:3,
   pq:'As regras dizem à IA o que fazer quando falta informação. Sem isso, ela completa o buraco com algo genérico.'},
  {t:'html', h:`<h2>Parte 4 de 5 · Ajustar a conversa (a habilidade que mais faz diferença)</h2>
  <p>Mesmo com um bom pedido, <b>a primeira resposta é um rascunho</b>. Quem usa bem a IA não acerta de primeira: sabe corrigir a rota. Veja uma conversa de verdade, em 3 rodadas:</p>
  <div class="chat">
  <div class="bolha eu">(manda o pedido final da parte 3)</div>
  <div class="bolha ia">Aqui está o POP com 14 passos... <i>[passo 9: "registrar no sistema de gestão de armazém"]</i>... e o checklist.</div>
  <div class="bolha eu">Bom começo. Ajustes: 1) reduza para no máximo 10 passos, juntando os de conferência; 2) o passo 9 fala em sistema de armazém, mas a entrada é feita direto no ERP; 3) mantenha o checklist como está.</div>
  <div class="bolha ia">Pronto: 10 passos, passo 9 corrigido para o ERP, checklist mantido.</div>
  <div class="bolha eu">Agora revise como se fosse um conferente no primeiro dia de trabalho: o que ficaria confuso?</div>
  <div class="bolha ia">Três pontos: "área de pendências" não está definida; não diz o que fazer se faltar volume; o passo 6 usa a sigla NF-e sem explicar.</div>
  </div>
  <p>Repare: na rodada 2 ele disse <b>o que mudar e o que manter</b>, e na rodada 3 pediu <b>crítica</b>. São técnicas. As principais:</p>
  <div class="passo"><div class="n">1</div><div><b>Diga exatamente o que mudar e o que manter.</b><br><span class="mut">Ruim: "melhora isso". Bom: "reduza para 8 passos e mantenha o checklist".</span></div></div>
  <div class="passo"><div class="n">2</div><div><b>Aponte o erro e dê o fato certo.</b><br><span class="mut">"O passo 4 fala em WMS. Não temos WMS: a entrada é no ERP. Corrija só esse passo."</span></div></div>
  <div class="passo"><div class="n">3</div><div><b>Peça para ela perguntar antes.</b><br><span class="mut">"Antes de reescrever, me faça até 5 perguntas sobre o nosso recebimento."</span></div></div>
  <div class="passo"><div class="n">4</div><div><b>Peça versões.</b><br><span class="mut">"Me dê 2 versões: uma curta para o mural e uma completa para o treinamento."</span></div></div>
  <div class="passo"><div class="n">5</div><div><b>Peça crítica.</b><br><span class="mut">"Revise como se fosse o conferente novo: o que ficaria confuso?"</span></div></div>
  <div class="box"><b>Quando começar uma conversa nova?</b> Quando a conversa ficou longa e a IA começa a misturar ou esquecer coisas. Antes de sair, peça: "resuma em 10 linhas o que decidimos". Depois cole esse resumo na conversa nova.</div>`},
  {t:'check', id:'u1-k4', p:'A resposta veio boa, mas usa termos que um colega novo não entenderia. Qual é a melhor próxima mensagem?',
   o:['"Ficou bom, mas dá para deixar tudo um pouco mais simples?"','"Está difícil de entender. Refaz tudo do zero, por favor."','"Troque os termos técnicos por palavras simples; mantenha os passos."','Começar uma conversa nova e mandar o mesmo pedido de antes'], c:2,
   pq:'Diz exatamente o que mudar (os termos) e o que manter (os passos). "Mais simples" é vago, e refazer do zero joga fora o que já estava bom.'},
  {t:'html', h:`<h2>Parte 5 de 5 · Como conferir (o "Discernir")</h2>
  <div class="chk">✅ <span><b>Bate com a realidade?</b> Leia como se fosse o colega novo. Dá para seguir no seu armazém?</span></div>
  <div class="chk">✅ <span><b>Cace os inventados:</b> nomes, números, fórmulas, normas, sistemas, leis. Cada um desses precisa ser confirmado.</span></div>
  <div class="chk">✅ <span><b>Peça a crítica:</b> "Aponte 3 pontos fracos desta resposta" ou "O que aqui você não tem certeza?"</span></div>
  <div class="chk">✅ <span><b>Teste pequeno:</b> use primeiro com um colega ou num recebimento antes de imprimir para todos.</span></div>
  <div class="chk">✅ <span><b>Fato importante → fonte oficial.</b> Nunca use a própria IA para conferir a IA (lembra do advogado?).</span></div>
  <div class="box es"><b>Regra de ouro dos dados (essencial):</b> nunca coloque custos, preços, nomes de fornecedores ou dados pessoais num pedido. Use dados operacionais (quantidades, prazos, passos) ou invente números parecidos.</div>`},
  {t:'campo', id:'u1-e2-explique', label:'Para fixar: explique para um colega, com suas palavras, por que a IA às vezes inventa coisas e o que ele deve fazer a respeito.', ph:'Tente sem olhar o texto acima. Se travar, releia a comparação do colega veterano.', corrigir:true},
  {t:'links', titulo:'Assista e leia (escolha pelo menos 1 vídeo)', itens:LINKS_U1.slice(0,3)}
 ]},
 {n:3, titulo:'Fazer junto', tipo:'Você faz, eu dou dicas', essencial:false, blocos:[
  {t:'html', h:`<p>Quatro exercícios. Se travar, abra <b>uma dica por vez</b>. O exemplo de resposta só aparece depois que você escrever a sua. Quando terminar, peça a minha correção: eu leio o que você escreveu e respondo aqui no site.</p>`},
  {t:'exercicio', id:'u1-ex1', titulo:'Exercício 1 · Descrever', enun:'Reescreva este pedido usando as 5 partes (PCTFE):', pedido:'me ajuda com o inventário',
   dicas:['Antes de escrever: o que exatamente você quer? Planejar o inventário, organizar a contagem ou analisar as diferenças depois? Escolha <b>uma</b> coisa.',
   'Passe pelas 5 letras: Papel, Contexto, Tarefa, Formato, Exemplo. Quantas o pedido original tem? (Nenhuma!) Escreva uma linha para cada.',
   'Comece assim: "Você é um analista de estoque experiente. Contexto: vamos fazer o inventário rotativo dos itens da Curva A..." e continue com a tarefa e o formato.'],
   exemplo:`Você é um analista de estoque experiente que ajuda equipes pequenas a se organizar.
Contexto: somos 2 pessoas no estoque de uma empresa de equipamentos médicos veterinários. Queremos começar um inventário rotativo dos 20 itens da Curva A, contando alguns por semana, sem parar a operação. Usamos um ERP.
Tarefa: monte um plano de contagem para 4 semanas.
Formato: uma tabela com semana, quais itens contar (use "Item 1, Item 2..."), quem conta e quanto tempo leva. Depois, 3 dicas para reduzir erro na contagem.
Regras: se faltar informação, pergunte antes. Não invente nomes de produtos.`,
   checklist:['Tem papel (quem a IA deve ser)?','Tem contexto (empresa, equipe, sistema, objetivo)?','A tarefa é uma só e tem começo e fim?','O formato da resposta está claro?','Tem exemplo ou regra (ex.: "pergunte se faltar informação")?','Está sem custos, preços e fornecedores?']},
  {t:'exercicio', id:'u1-ex2', titulo:'Exercício 2 · Discernir', enun:'Um colega perguntou à IA "o que é giro de estoque?" e recebeu a resposta abaixo. Encontre pelo menos 3 problemas.',
   pedido:`Giro de estoque mede quantas vezes o estoque se renova em um período. A fórmula é:
Giro = Estoque médio ÷ Quantidade que saiu no período.
Segundo a Resolução nº 47 do Conselho Nacional de Logística, o giro ideal para qualquer empresa é de 12 vezes por ano. Quanto maior o giro, sempre melhor.`,
   dicas:['Leia frase por frase e pergunte: "isso eu consigo comprovar? Bate com o que eu vejo no meu armazém?"',
   'Lembre onde a IA mais inventa: números, fórmulas, nomes, normas, citações. Marque cada um desses no texto. Quantos achou?',
   'Teste a fórmula com números: estoque médio de 50 unidades, saíram 200 no ano. Pela fórmula do texto, o giro dá 0,25. Isso faz sentido? E um item importado, com 90 dias de prazo, deveria ter o mesmo giro que um item comprado no Brasil?'],
   exemplo:`1. Fórmula invertida. O certo é: Giro = Quantidade que saiu ÷ Estoque médio. (200 ÷ 50 = giro 4.)
2. Fonte inventada. Não existe "Conselho Nacional de Logística" que defina giro. Citação de norma ou órgão sempre precisa de conferência.
3. Generalização falsa. Não existe giro ideal para qualquer empresa: depende do produto, do prazo de reposição e da demanda.
4. "Quanto maior, sempre melhor" também é falso. Giro alto demais pode significar estoque curto demais e risco de faltar produto.`,
   checklist:['Achei o erro na fórmula','Desconfiei da fonte citada','Percebi a generalização ("qualquer empresa")','Percebi o "sempre melhor"']},
  {t:'exercicio', id:'u1-ex4', titulo:'Exercício 3 · Ajustar a conversa', enun:'Você pediu um checklist de expedição e a IA respondeu o texto abaixo. Escreva a sua PRÓXIMA mensagem na conversa para consertar a resposta.',
   pedido:`Checklist de expedição:
1. Verificar a temperatura do baú do caminhão
2. Conferir o pedido no WMS
3. Embalar o produto
4. Lacrar a caixa
5. Colocar a nota fiscal
6. Conferir o número de série do equipamento
7. Tirar foto da caixa lacrada
8. Registrar a saída
9. Avisar o cliente
10. Arquivar o canhoto
11. Conferir o endereço de entrega
12. Separar acessórios
(Contexto: vocês despacham equipamentos médicos veterinários, usam ERP e não têm WMS. O erro mais comum é a caixa sair sem manual.)`,
   dicas:['Primeiro, liste para você mesmo tudo que está errado ou fora de lugar. Olhe também a <b>ordem</b> dos itens: tem coisa sendo feita depois da hora?',
   'Use as técnicas da parte 4: diga exatamente o que mudar, dê o fato certo e diga o que manter. Mensagem vaga ("melhora isso") não vale.',
   'Repare nos itens 4, 6 e 12: dá para conferir o número de série e separar acessórios depois de lacrar a caixa? E o manual, que é o erro mais comum, aparece?'],
   exemplo:`Ajustes no checklist:
1) Tire o item 1 (temperatura): não se aplica aos nossos produtos.
2) No item 2, troque WMS por ERP.
3) Corrija a ordem: conferir número de série, separar acessórios e conferir o endereço vêm ANTES de embalar e lacrar.
4) Inclua "manual e acessórios dentro da caixa" logo antes de lacrar. É o nosso erro mais comum.
5) Deixe no máximo 10 itens, em ordem cronológica. Mantenha a foto da caixa lacrada e o aviso ao cliente.`,
   checklist:['Disse exatamente o que mudar (nada de "melhora isso")','Deu o fato certo (ERP, não WMS; temperatura não se aplica)','Corrigiu a ordem (conferir antes de lacrar)','Incluiu o manual','Disse o que manter']},
  {t:'classificar', id:'u1-ex3', titulo:'Exercício 4 · Delegar', enun:'Para cada tarefa, decida: quem faz?',
   ops:['IA faz sozinha','IA ajuda, eu confiro','Só eu'],
   itens:[

 {n:4, titulo:'Fazer sozinho', tipo:'Aplicar no seu trabalho', essencial:false, blocos:[
  {t:'html', h:`<div class="card es"><span class="tag es">Missão da semana</span><h3>Use IA numa tarefa real sua</h3>
  <p>Escolha <b>1 tarefa</b> que você faz na mão e que envolve texto, organização ou planilha. Algumas ideias:</p>
  <ul><li>escrever ou atualizar um procedimento (POP);</li><li>montar uma fórmula de planilha;</li><li>organizar uma lista ou um checklist;</li><li>preparar uma mensagem para outro setor;</li><li>resumir anotações de uma reunião.</li></ul>
  <p><b>Regra:</b> sem custos, preços, fornecedores ou dados pessoais. Se precisar, troque por dados fictícios.</p>
  <p><b>Meta:</b> fazer pelo menos <b>2 rodadas de ajuste</b> na conversa (parte 4 da etapa 2).</p></div>
  <p>Registre abaixo. O registro é o que vira aprendizado, e mais tarde vira portfólio.</p>`},
  {t:'campo', id:'u1-e4-tarefa', label:'1. Qual tarefa você escolheu e por quê?', ph:'Ex.: atualizar o checklist de expedição, porque hoje cada um faz de um jeito.', l:3},
  {t:'campo', id:'u1-e4-pedido1', label:'2. Seu pedido (versão 1), com as 5 partes', ph:'Papel... Contexto... Tarefa... Formato... Exemplo e regras...'},

const K_DADOS='ge_dados', K_CFG='ge_cfg', ARQ='dados.json';
const INTERVALOS=[1,3,7,21,60]; // dias até a próxima revisão, por caixa
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const somaDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dataBR=s=>{if(!s)return'';const [a,m,d]=s.slice(0,10).split('-');return d+'/'+m+'/'+a};

function novo(){return{versao:1,atualizadoEm:0,etapas:{},resp:{},checks:{},dicas:{},revel:{},classif:{},quiz:{},pontos:{},correcao:{},dominio:{},cartoes:{},notas:[]}}
function lerLocal(){try{const d=JSON.parse(localStorage.getItem(K_DADOS));return Object.assign(novo(),d||{})}catch(e){return novo()}}
function lerCfg(){try{return JSON.parse(localStorage.getItem(K_CFG))||null}catch(e){return null}}
let D=lerLocal(), CFG=lerCfg();
let C={};try{C=JSON.parse(localStorage.getItem('ge_corr'))||{}}catch(e){C={}}

// ---------- salvar + sincronizar com o cofre (repositório privado) ----------
let tSync=null, sha=null, enviando=false, pendente=false;
function salvar(){D.atualizadoEm=Date.now();try{localStorage.setItem(K_DADOS,JSON.stringify(D))}catch(e){}
 atualizaBadge(); if(CFG){status('sv','Salvando…');clearTimeout(tSync);tSync=setTimeout(enviar,1500)}}
function status(cl,tx){const b=$('#sync');b.className='sync '+cl;b.textContent=tx}
function b64enc(str){const by=new TextEncoder().encode(str);let s='';for(let i=0;i<by.length;i+=8192)s+=String.fromCharCode.apply(null,by.subarray(i,i+8192));return btoa(s)}
function b64dec(b){const bin=atob(b.replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function api(path,opt={}){return fetch('https://api.github.com/repos/'+encodeURIComponent(CFG.dono)+'/'+encodeURIComponent(CFG.repo)+'/contents/'+path,
 Object.assign({cache:'no-store'},opt,{headers:Object.assign({'Authorization':'Bearer '+CFG.chave,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.headers||{})}))}
async function baixar(arq){ // retorna {dados, sha} ou null se ainda não existe
 const r=await api(arq||ARQ);
 if(r.status===404)return null;
 if(!r.ok)throw new Error(r.status);
 const j=await r.json();return{dados:JSON.parse(b64dec(j.content)),sha:j.sha}}
async function enviar(){
 if(!CFG)return; if(enviando){pendente=true;return}
 enviando=true;
 try{
  for(let tent=0;tent<2;tent++){
   const corpo={message:'estudo '+new Date().toLocaleString('pt-BR'),content:b64enc(JSON.stringify(D,null,1))};
   if(sha)corpo.sha=sha;
   const r=await api(ARQ,{method:'PUT',body:JSON.stringify(corpo),headers:{'Content-Type':'application/json'}});
   if(r.ok){sha=(await r.json()).content.sha;status('ok','Salvo no cofre ✓');break}
   if((r.status===409||r.status===422)&&tent===0){const rem=await baixar();sha=rem?rem.sha:null;continue}
   throw new Error(r.status)}
 }catch(e){status('er',erroTxt(e))}
 enviando=false; if(pendente){pendente=false;enviar()}}
function erroTxt(e){const m=String(e.message||e);if(m==='401')return'Chave inválida';if(m==='404')return'Cofre não encontrado';if(m==='403')return'Chave sem permissão';return'Sem conexão (salvo aqui)'}
async function puxar(){
 if(!CFG)return;
 status('sv','Conferindo…');
 try{
  try{const co=await baixar('correcoes.json');if(co&&JSON.stringify(co.dados)!==JSON.stringify(C)){C=co.dados||{};localStorage.setItem('ge_corr',JSON.stringify(C));render(true)}}catch(e){}
  const rem=await baixar();
  if(!rem){sha=null;await enviar();return}
  sha=rem.sha;
  if((rem.dados.atualizadoEm||0)>(D.atualizadoEm||0)){D=Object.assign(novo(),rem.dados);localStorage.setItem(K_DADOS,JSON.stringify(D));render()}
  else if((rem.dados.atualizadoEm||0)<(D.atualizadoEm||0)){await enviar();return}
  status('ok','Salvo no cofre ✓')
 }catch(e){status('er',erroTxt(e))}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')puxar()});

// ---------- regras do curso ----------

const etKey=(u,n)=>u.id+'-e'+n;
const feita=(u,n)=>!!D.etapas[etKey(u,n)];
function progresso(u){if(!u.etapas)return 0;return Math.round(u.etapas.filter(e=>feita(u,e.n)).length/u.etapas.length*100)}
function cartoesAtivos(){const l=[];UNIDADES.forEach(u=>{if(u.cartoes&&u.etapas&&feita(u,2))u.cartoes.forEach(c=>l.push(Object.assign({u:u.id},c)))});return l}
function devidos(){const h=hoje();return cartoesAtivos().filter(c=>{const s=D.cartoes[c.id];return!s||s.proxima<=h})}
function essenciaisPendentes(){const l=[];UNIDADES.filter(u=>u.status==='aberta').forEach(u=>u.etapas.forEach(e=>{if(e.essencial&&!feita(u,e.n))l.push({u,e})}));return l}
function proximaEtapa(){for(const u of UNIDADES.filter(u=>u.status==='aberta'))for(const e of u.etapas)if(!feita(u,e.n))return{u,e};return null}

function telaUnidade(u){
 if(!u||u.status!=='aberta')return`<p>Esta unidade ainda está em construção.</p><a class="btn sec" href="#/">Voltar</a>`;

 u.etapas.forEach(e=>{h+=`<div class="card ${feita(u,e.n)?'feito':''}"><a href="#/u/${u.id}/${e.n}"><span class="ic">${feita(u,e.n)?'✓':e.n}</span><span><b>${esc(e.titulo)}</b> ${e.essencial?'<span class="tag es">Essencial</span>':''}<br><span class="mut">${esc(e.tipo)}</span></span></a></div>`});

 let h=`<a href="#/u/${u.id}" class="mut">← Unidade ${u.n} · ${esc(u.titulo)}</a><h1>${e.n}. ${esc(e.titulo)}</h1><p class="mut">${esc(e.tipo)} ${e.essencial?'<span class="tag es">Essencial</span>':''}</p>`;

 h+=`<div class="nav-et">${n>1?`<a class="btn sec" href="#/u/${u.id}/${n-1}">← Anterior</a>`:'<span></span>'}${n<u.etapas.length?`<a class="btn sec" href="#/u/${u.id}/${n+1}">Próxima →</a>`:''}</div>`;
 return h}

function bloco(b){
 if(b.t==='html')return b.h;

   return`<label class="op ${cl}"><input type="radio" name="${b.id}" value="${j}" ${r===j?'checked':''} ${r!==undefined?'disabled':''}>${esc(o)}</label>`}).join('')+
   (r!==undefined?`<div class="${r===b.c?'box ok':'box er'}" style="font-size:14px">${r===b.c?'✓ Isso. ':'✗ Não foi dessa vez. '}${esc(b.pq)}</div>`:`<button class="btn peq" onclick="responderCheck('${b.id}')">Responder</button><div class="erro" id="er-${b.id}"></div>`)+`</div>`}
 if(b.t==='revelar'){const ab=D.revel[b.id];return`<div id="rv-${b.id}">${ab?b.h:`<button class="btn sec" onclick="revelar('${b.id}','${b.exige}')">${esc(b.botao)}</button><div class="erro" id="er-${b.id}"></div>`}</div>`}
 if(b.t==='links')return`<h2>${esc(b.titulo)}</h2>`+linksHTML(b.itens);

  h+=D.revel[b.id]?`<div class="box ok"><b>Um exemplo de resposta</b> (o seu não precisa ser igual):<div class="pedido" style="margin-top:8px">${esc(b.exemplo)}</div></div>`

  return h+boxCorrecao(b.id)+`</div>`}
 if(b.t==='classificar'){

  b.qs.forEach((x,i)=>{const resp=q&&q.r?q.r[i]:undefined;
   h+=`<div class="card"><b>${i+1}. ${esc(x.p)}</b>`+x.o.map((o,j)=>{let cl='';if(q&&q.r){if(j===x.c)cl='certa';else if(Number(resp)===j)cl='errada'}
    return`<label class="op ${cl}"><input type="radio" name="${b.id}-${i}" value="${j}" ${Number(resp)===j?'checked':''} ${q&&q.r?'disabled':''}>${esc(o)}</label>`}).join('');
   if(q&&q.r)h+=`<div class="${Number(resp)===x.c?'box ok':'box er'}" style="font-size:14px">${Number(resp)===x.c?'✓ Certo. ':'✗ '}${esc(x.pq)}</div>`;
   h+=`</div>`});
  if(q&&q.r){const ok=q.a>=b.min;
   h+=`<div class="box ${ok?'ok':'es'}"><b>${q.a} de ${b.qs.length}.</b> ${ok?'Unidade dominada! As perguntas continuam voltando na Revisão.':'Quase. Releia as explicações das que errou, volte à etapa 2 se precisar e tente de novo outro dia.'}</div>
    <button class="btn sec" onclick="refazerQuiz('${b.id}')">Fazer de novo</button>`}
  else h+=`<button class="btn" onclick="corrigirQuiz('${b.id}')">Corrigir</button><div class="erro" id="er-${b.id}"></div>`;
  return h+`</div>`}
 return''}

// ---------- correção pelo Claude ----------
function boxCorrecao(id){
 const c=C[id], pedido=D.correcao[id];
 let h='<div id="cr-'+id+'">';
 if(c)h+=`<div class="box ok"><b>Correção do Claude</b> <span class="mut">· ${esc(c.em||'')}</span><div class="nota" style="margin-top:6px">${esc(c.texto)}</div></div>`;
 if(pedido&&!(c&&c.ts&&c.ts>pedido))h+=`<div class="box">Correção pedida em ${new Date(pedido).toLocaleDateString('pt-BR')}. Quando quiser, me diga no chat: <b>"corrige minhas respostas"</b>. A correção aparece aqui.</div>`;
 else h+=`<button class="btn sec peq" onclick="pedirCorrecao('${id}')">${c?'Pedir nova correção':'Pedir correção ao Claude'}</button>`;
 h+=`<button class="btn sec peq" onclick="copiarCorrecao('${id}')">Copiar para colar no chat</button><div class="erro" id="ec-${id}"></div></div>`;
 return h}
function pedirCorrecao(id){if(!(D.resp[id]||'').trim()){$('#ec-'+id).textContent='Escreva a sua resposta primeiro.';return}D.correcao[id]=Date.now();salvar();render(true)}
function copiarCorrecao(id){const r=(D.resp[id]||'').trim();if(!r){$('#ec-'+id).textContent='Escreva a sua resposta primeiro.';return}
 const ac=acharBloco(id);const en=ac?String(ac.b.enun||ac.b.label||'').replace(/<[^>]+>/g,''):'';const pd=ac&&ac.b.pedido?'\nTexto do exercício:\n'+ac.b.pedido:'';
 const t='Corrija minha resposta do curso (Unidade '+(ac?ac.u.n:'')+', '+id+').\nEnunciado: '+en+pd+'\n\nMinha resposta:\n'+r;
 const ok=()=>{$('#ec-'+id).style.color='var(--ok)';$('#ec-'+id).textContent='Copiado! Cole no chat com o Claude.'};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}
function fallbackCopy(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()}
function responderCheck(id){const m=document.querySelector(`input[name="${id}"]:checked`);if(!m){$('#er-'+id).textContent='Escolha uma opção antes de responder.';return}D.pontos[id]=Number(m.value);salvar();render(true)}

// ---------- ações ----------
function acharBloco(id){for(const u of UNIDADES)for(const e of(u.etapas||[]))for(const b of e.blocos)if(b.id===id)return{u,e,b};return null}
function concluir(uid,n){D.etapas[uid+'-e'+n]=Date.now();salvar();render()}
function desfazer(uid,n){delete D.etapas[uid+'-e'+n];salvar();render()}
function dica(id){D.dicas[id]=(D.dicas[id]||0)+1;salvar();render(true)}
function revelar(id,exige){if(!(D.resp[exige]||'').trim()){$('#er-'+id).textContent='Escreva a sua resposta primeiro. Pensar antes de ver é o que faz aprender.';return}D.revel[id]=1;salvar();render(true)}
function conferirCls(id,n){const r=D.classif[id]||{};for(let i=0;i<n;i++)if(r[i]===undefined||r[i]===''){$('#er-'+id).textContent='Escolha uma opção para todas as tarefas antes de conferir.';return}r._conf=1;D.classif[id]=r;salvar();render(true)}
function corrigirQuiz(id){const {u,b}=acharBloco(id);const r=[];
 for(let i=0;i<b.qs.length;i++){const m=document.querySelector(`input[name="${id}-${i}"]:checked`);if(!m){$('#er-'+id).textContent='Responda todas as perguntas antes de corrigir.';return}r.push(Number(m.value))}
 const a=r.filter((v,i)=>v===b.qs[i].c).length;D.quiz[id]={r,a,em:Date.now()};
 if(a>=b.min){D.dominio[u.id]=D.dominio[u.id]||Date.now();const e=u.etapas.find(e=>e.blocos.includes(b));D.etapas[u.id+'-e'+e.n]=D.etapas[u.id+'-e'+e.n]||Date.now()}
 salvar();render(true)}
function refazerQuiz(id){delete D.quiz[id];salvar();render(true)}

document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.resp){D.resp[t.dataset.resp]=t.value;const er=t.parentElement.querySelector('.erro');if(er)er.textContent='';salvarLento()}});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.dataset.chk){const c=D.checks[t.dataset.chk]||{};c[t.dataset.i]=t.checked;D.checks[t.dataset.chk]=c;salvar()}
 if(t.dataset.cls){const c=D.classif[t.dataset.cls]||{};c[t.dataset.i]=t.value;delete c._conf;D.classif[t.dataset.cls]=c;salvar()}});
let tLento=null;function salvarLento(){clearTimeout(tLento);tLento=setTimeout(salvar,800)}

// ---------- revisão espaçada ----------
let revAberta=false;
function telaRevisao(){
 const l=devidos(), at=cartoesAtivos().length;
 if(!at)return`<h1>Revisão</h1><div class="vazio">As perguntas de revisão aparecem depois que você concluir a etapa 2 (Exemplo resolvido) de uma unidade.</div>`;
 if(!l.length)return`<h1>Revisão</h1><div class="vazio">✓ Nada para revisar hoje.<br>Volte amanhã: as perguntas reaparecem em 1, 3, 7 e 21 dias.</div>`+resumoCaixas();
 const c=l[0], u=unid(c.u);
 return`<h1>Revisão</h1><p class="mut">${l.length} para hoje · responda de cabeça antes de ver</p>
 <div class="card ${c.es?'es':''}">${c.es?'<span class="tag es">Essencial</span>':''}<span class="tag cin">Unidade ${u.n}</span>
 <p style="font-size:17px"><b>${esc(c.p)}</b></p>
 <textarea id="rv-txt" rows="3" placeholder="Tente responder aqui (opcional, não é salvo)"></textarea>
 ${revAberta?`<div class="box ok" style="margin-top:12px">${esc(c.r)}</div><p><b>Você lembrou?</b></p>
 <button class="btn" onclick="avaliar('${c.id}',true)">Lembrei</button><button class="btn sec" onclick="avaliar('${c.id}',false)">Não lembrei</button>`
 :`<button class="btn" onclick="revAberta=true;render(true)">Mostrar resposta</button>`}</div>`+resumoCaixas()}
function resumoCaixas(){const at=cartoesAtivos();if(!at.length)return'';const cx=[0,0,0,0,0];at.forEach(c=>{const s=D.cartoes[c.id];cx[s?Math.min(s.caixa,4):0]++});
 return`<h2>Como está sua memória</h2><p class="mut">Cada acerto empurra a pergunta para mais longe (1 → 3 → 7 → 21 → 60 dias). Errou, ela volta para amanhã.</p>`+
 ['Nova / voltou','1 acerto','2 acertos','3 acertos','Firme'].map((t,i)=>`<div class="chk"><span style="width:110px">${t}</span><div class="barra" style="flex:1;margin-top:9px"><i style="width:${at.length?cx[i]/at.length*100:0}%"></i></div><span style="width:24px;text-align:right">${cx[i]}</span></div>`).join('')}
function avaliar(id,ok){const s=D.cartoes[id]||{caixa:0};s.caixa=ok?Math.min((s.caixa||0)+1,INTERVALOS.length):0;
 s.proxima=somaDias(ok?INTERVALOS[s.caixa-1]:1);s.vistoEm=Date.now();s.acertos=(s.acertos||0)+(ok?1:0);s.erros=(s.erros||0)+(ok?0:1);D.cartoes[id]=s;revAberta=false;salvar();render()}

// ---------- anotações ----------
let apagar=null;
function telaNotas(){
 let h=`<h1>Anotações</h1><p class="mut">Dúvidas, ideias, coisas que você viu no trabalho. O Claude lê isso para ajustar o curso.</p>
 <textarea id="nt" rows="4" placeholder="Escreva aqui…"></textarea>
 <select id="nt-u" style="margin-top:8px"><option value="">Sem unidade</option>${UNIDADES.map(u=>`<option value="${u.id}">Unidade ${u.n} · ${esc(u.titulo)}</option>`).join('')}<option value="duvida">Dúvida para o Claude</option></select>
 <button class="btn" onclick="addNota()">Salvar anotação</button><div class="erro" id="er-nt"></div>`;
 if(!D.notas.length)h+=`<div class="vazio">Nenhuma anotação ainda.</div>`;
 D.notas.slice().reverse().forEach(n=>{const u=unid(n.u);
  h+=`<div class="card"><div class="mut">${dataBR(n.data)} ${n.u==='duvida'?'<span class="tag es">Dúvida</span>':u?'<span class="tag">Unidade '+u.n+'</span>':''}</div><div class="nota">${esc(n.texto)}</div>
  <button class="btn ${apagar===n.id?'perigo':'sec'} peq" onclick="apagarNota('${n.id}')">${apagar===n.id?'Confirmar: apagar':'Apagar'}</button></div>`});
 return h}
function addNota(){const t=$('#nt').value.trim();if(!t){$('#er-nt').textContent='Escreva algo antes de salvar.';return}
 D.notas.push({id:'n'+Date.now(),data:hoje(),texto:t,u:$('#nt-u').value});salvar();render()}
function apagarNota(id){if(apagar!==id){apagar=id;render(true);return}D.notas=D.notas.filter(n=>n.id!==id);apagar=null;salvar();render(true)}

// ---------- ajustes ----------
function telaAjustes(){
 const c=CFG||{dono:'',repo:'meus-estudos',chave:''};
 return`<h1>Ajustes</h1>
 <div class="card"><h3 style="margin-top:0">Cofre privado (sincronizar celular e PC)</h3>
 <p class="mut">Seus dados ficam num repositório privado do seu GitHub. A chave fica salva só neste aparelho.</p>
 <label class="cmp" for="cf-dono">Seu usuário do GitHub</label><input type="text" id="cf-dono" value="${esc(c.dono)}" autocapitalize="off" autocomplete="off" placeholder="ex.: williampassos">
 <label class="cmp" for="cf-repo">Nome do cofre (repositório privado)</label><input type="text" id="cf-repo" value="${esc(c.repo)}" autocapitalize="off" autocomplete="off">
 <label class="cmp" for="cf-chave">Chave de acesso</label><input type="password" id="cf-chave" value="${esc(c.chave)}" autocomplete="off" placeholder="github_pat_...">
 <button class="btn" onclick="salvarCfg()">Salvar e conectar</button>${CFG?'<button class="btn perigo peq" onclick="tirarChave()">Desconectar este aparelho</button>':''}
 <div class="erro" id="er-cf"></div><div id="ok-cf" class="mut"></div></div>
 <div class="card"><h3 style="margin-top:0">Backup</h3><p class="mut">Uma cópia de segurança de tudo, num arquivo.</p>
 <button class="btn sec" onclick="baixarBackup()">Baixar backup</button>
 <label class="btn sec" style="display:inline-block">Restaurar backup<input type="file" accept=".json,application/json" style="display:none" onchange="restaurar(this)"></label><div class="erro" id="er-bk"></div></div>
 <p class="mut">Última alteração: ${D.atualizadoEm?new Date(D.atualizadoEm).toLocaleString('pt-BR'):'—'}</p>`}
async function salvarCfg(){
 const dono=$('#cf-dono').value.trim(), repo=$('#cf-repo').value.trim(), chave=$('#cf-chave').value.trim();
 if(!dono||!repo||!chave){$('#er-cf').textContent='Preencha os três campos.';return}
 CFG={dono,repo,chave};$('#er-cf').textContent='';$('#ok-cf').textContent='Testando a conexão…';
 try{const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(dono)+'/'+encodeURIComponent(repo),{cache:'no-store',headers:{'Authorization':'Bearer '+chave,'Accept':'application/vnd.github+json'}});
  if(!r.ok)throw new Error(r.status);const j=await r.json();
  if(!j.private){CFG=null;$('#ok-cf').textContent='';$('#er-cf').textContent='Esse repositório é PÚBLICO. Por segurança, o cofre precisa ser privado.';return}
  localStorage.setItem(K_CFG,JSON.stringify(CFG));$('#ok-cf').textContent='Conectado ✓ Sincronizando…';await puxar();$('#ok-cf').textContent='Conectado ✓'}
 catch(e){CFG=null;$('#ok-cf').textContent='';$('#er-cf').textContent={'401':'A chave não foi aceita. Confira se copiou inteira.','404':'Não achei esse repositório. Confira o usuário, o nome do cofre e se a chave tem acesso a ele.','403':'A chave não tem permissão para esse repositório.'}[e.message]||'Sem conexão. Tente de novo.'}}
function tirarChave(){localStorage.removeItem(K_CFG);CFG=null;status('','Só neste aparelho');render()}
function baixarBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='backup-estudos-'+hoje()+'.json';a.click()}
function restaurar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!('etapas' in d))throw 0;D=Object.assign(novo(),d);salvar();render();}catch(e){$('#er-bk').textContent='Esse arquivo não parece um backup do site.'}};r.readAsText(f)}

// ---------- roteador ----------
function render(manterScroll){
 const y=window.scrollY, p=(location.hash||'#/').slice(2).split('/');let h='',r='inicio';
 if(p[0]==='u'){const u=unid(p[1]);h=p[2]?telaEtapa(u,Number(p[2])):telaUnidade(u)}
 else if(p[0]==='revisao'){h=telaRevisao();r='revisao'}
 else if(p[0]==='notas'){h=telaNotas();r='notas'}
 else if(p[0]==='ajustes'){h=telaAjustes();r='ajustes'}
 else h=telaInicio();
 $('#app').innerHTML=h;
 document.querySelectorAll('nav.bot a').forEach(a=>a.classList.toggle('at',a.dataset.r===r));
 atualizaBadge(); window.scrollTo(0,manterScroll?y:0)}
window.addEventListener('hashchange',()=>{revAberta=false;apagar=null;render()});
render();
if(CFG)puxar();
</script>
</body>
</html>
